name: HandCannon
version: ${version}
main: dev.handcannon.HandCannonPlugin
api-version: '26.2'
description: "A comically oversized snubnose revolver with a 3D model. Right-click to fire."
commands:
  handcannon:
    description: Give the Hand Cannon, reload the config, or resend the resource pack
    usage: /handcannon [give|reload|pack] [player]
    permission: handcannon.admin
    aliases: [hc]
permissions:
  handcannon.admin:
    default: op
  handcannon.use:
    default: true
