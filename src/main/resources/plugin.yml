name: HandCannon
version: ${version}
main: dev.handcannon.HandCannonPlugin
api-version: '26.2'
description: "A comically oversized snubnose revolver, a cartoon Tommy gun, a double-barrel shotgun, the Pala-Pistol, the Goo Cannon, the Corruption Cannon, the Holy Blade sword, a stun grenade, a goo grenade and a nail bat, with 3D models."
commands:
  handcannon:
    description: Give the Hand Cannon, Tommy Gun, Double Barrel, Pala-Pistol, Goo Cannon, Corruption Cannon, Holy Blade, Stun Grenade, Goo Grenade or Nail Bat, reload the config, or resend the resource pack
    usage: /handcannon give [gun|tommy|shotgun|pala|goo|corruption|holy|grenade|googrenade|bat] [player] | reload | pack [player]
    permission: handcannon.admin
    aliases: [hc]
permissions:
  handcannon.admin:
    default: op
  handcannon.use:
    default: true
