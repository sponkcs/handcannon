damage: 10.0                # per shot: 10 = five hearts
headshot-multiplier: 1.0    # applied when the shot lands at head height (1.0 = no bonus)
range: 64                   # blocks
cooldown-ticks: 14          # time between shots (20 ticks = 1 s); shown as the cooldown sweep on the item
knockback: 1.2              # how hard a hit shoves the target (0 = vanilla knockback only)
recoil: 0.45                # how hard firing shoves the shooter back (0 = off)
pitch-kick: 6.0             # degrees the view kicks upward per shot (0 = off)
tommy:                      # the Tommy Gun: hold right-click for full auto
  damage: 10.0              # per bullet: 10 = five hearts
  headshot-multiplier: 1.0  # 1.0 = no bonus
  range: 48
  spread: 2.5               # degrees of wobble per bullet
  shots-per-click: 2        # holding right-click repeats every 4 ticks; this many bullets per repeat (2 = 10 a second)
  knockback: 0.15
shotgun:                    # the Double Barrel: right-click fires a blast of pellets
  damage: 10.0              # to each target caught in the blast, however many pellets hit it (10 = five hearts)
  headshot-multiplier: 1.0  # 1.0 = no bonus
  pellets: 8
  spread: 6.0               # degrees of wobble per pellet
  range: 24
  cooldown-ticks: 20        # time between shots (20 ticks = 1 s)
  knockback: 1.0            # full shove when every pellet hits
  recoil: 0.3
  pitch-kick: 4.0           # degrees the view kicks upward per shot (0 = off)
pala:                       # the Pala-Pistol: a slow bolt of light that stuns
  damage: 10.0              # 10 = five hearts
  speed: 0.8                # blocks per tick the bolt travels (an arrow at full draw is about 3)
  range: 48                 # blocks before it fizzles out
  stun-ticks: 60            # how long the target can't move, jump or attack (20 ticks = 1 s)
  cooldown-ticks: 12        # time between shots
goo:                        # the Goo Cannon: a glob of honey that traps whatever it hits (no damage)
  speed: 1.4                # how hard the glob is lobbed (a thrown snowball is 1.5)
  trap-ticks: 70            # how long the target is stuck in goo (20 ticks = 1 s; 70 = 3.5 s)
  break-free-presses: 12    # Shift presses a trapped player needs to break out early
  cooldown-ticks: 20        # time between shots
umbral:                     # the Corruption Cannon: an instant crimson beam that pierces everything in a line
  damage: 10.0              # to each target in the beam (10 = five hearts)
  range: 40                 # blocks, or up to the first wall
  darkness-ticks: 100       # how long targets get the Darkness effect (20 ticks = 1 s; 0 = off)
  cooldown-ticks: 24        # time between shots
bat:                        # the Nail Bat (damage and speed are set on each bat when it is given)
  damage: 10.0              # left-click hit at full strength: 10 = five hearts (stamped on each bat when given)
  attack-speed: 0.9         # left-click swings per second (a sword is 1.6, an axe about 1.0)
  charge-ticks: 20          # how long to hold right-click before letting go swings a home run (20 = 1 s)
  home-run-damage: 10.0     # damage of the home-run swing
  home-run-reach: 3.5       # blocks
  home-run-power: 2.4       # how far a home run sends the target
  home-run-lift: 1.1        # how high it goes
resource-pack:
  url: ""                   # public link to handcannon-resourcepack.zip (both items)
  sha1: ""                  # 40-character sha1 of the zip (printed by tools/make_pack.py)
  required: false
